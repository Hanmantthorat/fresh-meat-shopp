<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresh Cuts Meat & Chicken Store</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #ef4444; /* Red meat accent */
      --accent-hover: #dc2626;
      --whatsapp: #22c55e; /* WhatsApp green */
      --whatsapp-hover: #16a34a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 100px;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cart-badge {
      background-color: var(--accent);
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .hero {
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.15) 0%, rgba(15, 23, 42, 0) 100%);
      text-align: center;
      padding: 2rem 1rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Delivery Areas Display */
    .delivery-zones {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 2rem;
    }

    .delivery-zones h3 {
      font-size: 0.95rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .area-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .area-tag {
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #334155;
    }

    .product-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .product-header h3 {
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .product-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .price-tag {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    select, input[type="text"], input[type="tel"], textarea {
      width: 100%;
      padding: 0.65rem;
      background-color: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn-add {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background-color: var(--accent-hover);
    }

    /* Floating Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.4);
      z-index: 20;
    }

    .cart-summary {
      display: flex;
      flex-direction: column;
    }

    .cart-total {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .btn-whatsapp {
      background-color: var(--whatsapp);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
    }

    .btn-whatsapp:hover {
      background-color: var(--whatsapp-hover);
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      justify-content: center;
      align-items: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      border: 1px solid var(--border);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h2 {
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }

    .form-group {
      margin-bottom: 0.85rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🍗 Fresh Cuts Meat</div>
    <div class="cart-badge" id="cart-count">0 items</div>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Fresh &amp; Hygienic Chicken Delivered</h1>
      <p>Select cuts, pick a delivery slot (4 AM – 10 PM), and order on WhatsApp!</p>
    </div>

    <!-- Delivery Area Display -->
    <div class="delivery-zones">
      <h3>📍 Deliverable Areas in Pune</h3>
      <div class="area-tags" id="area-tags-container"></div>
    </div>

    <h2>Our Products</h2>
    <br>
    <div class="product-grid" id="product-grid"></div>
  </div>

  <!-- Bottom Checkout Bar -->
  <div class="cart-bar">
    <div class="cart-summary">
      <span class="cart-total" id="cart-total">Total: ₹0</span>
      <span style="font-size: 0.8rem; color: var(--text-muted);" id="cart-items-summary">No items selected</span>
    </div>
    <button class="btn-whatsapp" onclick="openCheckoutModal()">
      <span>Order on WhatsApp</span>
    </button>
  </div>

  <!-- Order Details Modal -->
  <div class="modal" id="checkout-modal">
    <div class="modal-content">
      <h2>Delivery &amp; Checkout</h2>
      
      <div class="form-group">
        <label>Your Name *</label>
        <input type="text" id="cust-name" placeholder="e.g. Rahul Sharma" required />
      </div>

      <div class="form-group">
        <label>Phone Number *</label>
        <input type="tel" id="cust-phone" placeholder="e.g. 9876543210" required />
      </div>

      <div class="form-group">
        <label>Select Delivery Area *</label>
        <select id="cust-area" required>
          <option value="">-- Choose your area --</option>
        </select>
      </div>

      <div class="form-group">
        <label>Preferred Delivery Time Slot (4 AM – 10 PM) *</label>
        <select id="cust-timeslot" required>
          <option value="">-- Choose a time slot --</option>
          <option value="4:00 AM - 6:00 AM">4:00 AM - 6:00 AM (Early Morning Cut)</option>
          <option value="6:00 AM - 8:00 AM">6:00 AM - 8:00 AM</option>
          <option value="8:00 AM - 10:00 AM">8:00 AM - 10:00 AM</option>
          <option value="10:00 AM - 12:00 PM">10:00 AM - 12:00 PM</option>
          <option value="12:00 PM - 2:00 PM">12:00 PM - 2:00 PM</option>
          <option value="2:00 PM - 4:00 PM">2:00 PM - 4:00 PM</option>
          <option value="4:00 PM - 6:00 PM">4:00 PM - 6:00 PM</option>
          <option value="6:00 PM - 8:00 PM">6:00 PM - 8:00 PM</option>
          <option value="8:00 PM - 10:00 PM">8:00 PM - 10:00 PM (Late Night Cut)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Complete Address (Flat No., Building, Landmark) *</label>
        <textarea id="cust-address" placeholder="e.g. Flat 302, Green Park Society, near Main Market" rows="3" required></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeCheckoutModal()">Cancel</button>
        <button class="btn-whatsapp" style="flex: 2;" onclick="sendWhatsAppOrder()">Send Order via WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    // Replace with your shop's WhatsApp phone number (with country code, no + or spaces)
    const SHOP_WHATSAPP_NUMBER = "919876543210"; 

    // Deliverable Areas List
    const deliverableAreas = [
      "Hadapsar",
      "Kondhwa",
      "Kharadi",
      "Swargate",
      "Sinhgad Rd",
      "Hinjewadi",
      "Wakad",
      "Chinchwad"
    ];

    // Product List with Photos
    const products = [
      { 
        id: 1, 
        name: "Fresh Whole Chicken (Curry Cut)", 
        desc: "Skinless, tender fresh cut chicken pieces suitable for everyday curry.", 
        pricePerKg: 220,
        image: "https://images.unsplash.com/photo-1587593810167-a84920ea0781?auto=format&fit=crop&w=600&q=80"
      },
      { 
        id: 2, 
        name: "Chicken Breast (Boneless)", 
        desc: "Lean, high-protein boneless chicken breast fillets.", 
        pricePerKg: 340,
        image: "https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&w=600&q=80"
      },
      { 
        id: 3, 
        name: "Chicken Drumsticks", 
        desc: "Juicy leg pieces, perfect for fry, grilling, or biryani.", 
        pricePerKg: 280,
        image: "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=600&q=80"
      },
      { 
        id: 4, 
        name: "Chicken Lollipop", 
        desc: "Cleaned winglet pieces shaped into crisp lollipops.", 
        pricePerKg: 300,
        image: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=600&q=80"
      },
      { 
        id: 5, 
        name: "Chicken Mince (Keema)", 
        desc: "Finely ground fresh chicken breast mince for kebabs and parathas.", 
        pricePerKg: 350,
        image: "https://images.unsplash.com/photo-1588168333986-5078d3ae3976?auto=format&fit=crop&w=600&q=80"
      },
      { 
        id: 6, 
        name: "Chicken Wings", 
        desc: "Fresh chicken wings for roasting, frying, or BBQ grilling.", 
        pricePerKg: 200,
        image: "https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let cart = [];

    // Render Deliverable Areas
    function renderDeliveryAreas() {
      const tagsContainer = document.getElementById('area-tags-container');
      const areaSelect = document.getElementById('cust-area');

      tagsContainer.innerHTML = deliverableAreas.map(area => `
        <span class="area-tag">✓ ${area}</span>
      `).join('');

      deliverableAreas.forEach(area => {
        const option = document.createElement('option');
        option.value = area;
        option.textContent = area;
        areaSelect.appendChild(option);
      });
    }

    // Render Product Cards
    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.image}" alt="${p.name}" class="product-img" loading="lazy" />
          <div class="product-info">
            <div class="product-header">
              <h3>${p.name}</h3>
              <p class="product-desc">${p.desc}</p>
            </div>
            <div>
              <div class="price-tag">₹${p.pricePerKg} / kg</div>
              <div class="options-group">
                <label style="font-size: 0.8rem; color: var(--text-muted);">Select Weight:</label>
                <select id="weight-${p.id}">
                  <option value="0.5">500g (₹${p.pricePerKg * 0.5})</option>
                  <option value="1" selected>1 kg (₹${p.pricePerKg})</option>
                  <option value="1.5">1.5 kg (₹${p.pricePerKg * 1.5})</option>
                  <option value="2">2 kg (₹${p.pricePerKg * 2})</option>
                </select>
              </div>
              <button class="btn-add" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Add Item to Cart
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const weightSelect = document.getElementById(`weight-${productId}`);
      const weight = parseFloat(weightSelect.value);
      const itemPrice = product.pricePerKg * weight;

      const existingIndex = cart.findIndex(item => item.id === productId && item.weight === weight);

      if (existingIndex > -1) {
        cart[existingIndex].qty += 1;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          weight: weight,
          pricePerItem: itemPrice,
          qty: 1
        });
      }

      updateCartUI();
    }

    // Update Cart Floating UI
    function updateCartUI() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.pricePerItem * item.qty), 0);

      document.getElementById('cart-count').textContent = `${totalCount} items`;
      document.getElementById('cart-total').textContent = `Total: ₹${totalPrice}`;
      
      if (totalCount > 0) {
        document.getElementById('cart-items-summary').textContent = `${totalCount} item(s) ready for checkout`;
      } else {
        document.getElementById('cart-items-summary').textContent = 'No items selected';
      }
    }

    // Modal Controls
    function openCheckoutModal() {
      if (cart.length === 0) {
        alert("Please add at least one product to your cart first.");
        return;
      }
      document.getElementById('checkout-modal').style.display = 'flex';
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').style.display = 'none';
    }

    // Send Order to WhatsApp
    function sendWhatsAppOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const area = document.getElementById('cust-area').value;
      const timeslot = document.getElementById('cust-timeslot').value;
      const address = document.getElementById('cust-address').value.trim();

      if (!name || !phone || !area || !timeslot || !address) {
        alert("Please complete all required fields, including your preferred delivery slot.");
        return;
      }

      let message = `🛒 *NEW FRESH CUTS ORDER*\n`;
      message += `-------------------------\n`;
      message += `*Customer Details:*\n`;
      message += `👤 Name: ${name}\n`;
      message += `📞 Phone: ${phone}\n`;
      message += `📍 Area: ${area}\n`;
      message += `⏰ Delivery Slot: ${timeslot}\n`;
      message += `🏠 Address: ${address}\n\n`;
      message += `*Order Items:*\n`;

      let totalPrice = 0;
      cart.forEach((item, index) => {
        const itemTotal = item.pricePerItem * item.qty;
        totalPrice += itemTotal;
        const weightLabel = item.weight >= 1 ? `${item.weight}kg` : `${item.weight * 1000}g`;
        message += `${index + 1}. ${item.name} (${weightLabel}) x ${item.qty} = ₹${itemTotal}\n`;
      });

      message += `-------------------------\n`;
      message += `*Total Amount: ₹${totalPrice}*\n`;
      message += `-------------------------\n`;
      message += `Please confirm my order and send payment details.`;

      const encodedMsg = encodeURIComponent(message);
      const whatsappURL = `https://wa.me/${SHOP_WHATSAPP_NUMBER}?text=${encodedMsg}`;
      
      window.open(whatsappURL, '_blank');
      closeCheckoutModal();
    }

    // Initialize App
    renderDeliveryAreas();
    renderProducts();
  </script>
</body>
</html>
