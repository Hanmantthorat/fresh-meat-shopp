<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Task Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .app-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      height: fit-content;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button.btn-add {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.btn-add:hover {
      opacity: 0.9;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background-color: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .task-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .delete-btn:hover {
      background-color: rgba(244, 63, 94, 0.1);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>Task Tracker</h1>
    
    <form class="input-group" id="task-form">
      <input type="text" id="task-input" placeholder="Add a new task..." required />
      <button type="submit" class="btn-add">Add</button>
    </form>

    <ul class="task-list" id="task-list"></ul>
    <p class="empty-state" id="empty-state">No tasks yet. Add one above!</p>
  </div>

  <script>
    // State management
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

    // DOM Elements
    const taskForm = document.getElementById('task-form');
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');
    const emptyState = document.getElementById('empty-state');

    // Save tasks to Local Storage
    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
      renderTasks();
    }

    // Render tasks on screen
    function renderTasks() {
      taskList.innerHTML = '';
      
      if (tasks.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
      }

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        li.innerHTML = `
          <div class="task-content" onclick="toggleTask(${index})">
            <input type="checkbox" ${task.completed ? 'checked' : ''} readOnly />
            <span>${escapeHTML(task.text)}</span>
          </div>
          <button class="delete-btn" onclick="deleteTask(${index})" aria-label="Delete task">&times;</button>
        `;

        taskList.appendChild(li);
      });
    }

    // Add new task
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      
      if (text) {
        tasks.push({ text, completed: false });
        taskInput.value = '';
        saveTasks();
      }
    });

    // Toggle complete status
    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      saveTasks();
    }

    // Delete task
    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks();
    }

    // Sanitize input strings to prevent XSS
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Initial render on load
    renderTasks();
  </script>
</body>
</html>
